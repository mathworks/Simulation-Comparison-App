name: CI

# Controls when the workflow will run
on:
  # Allows the release workflow to require a successful CI run
  workflow_call:

  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches: [ "main" ]
    paths-ignore:
      - '*.md'
      - '.github/ISSUE_TEMPLATE'
      - '.github/workflows/release.yml'
      - 'toolbox/*.mlx'
      
  pull_request:
    branches: [ "main" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  check-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:  
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - name: Check out repo
        uses: actions/checkout@v7

      - name: Start virtual display server
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y xvfb
          Xvfb :99 &
          echo "DISPLAY=:99" >> $GITHUB_ENV

      - name: Cache MATLAB build files
        uses: actions/cache@v6
        with:
          key: matlab-buildtool
          path: |
            .buildtool

      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v3
        with:
          products: >
            Simulink
            Fixed-Point_Designer
          cache: true

      - name: Run MATLAB build
        uses: matlab-actions/run-build@v3

      - name: Upload SARIF file
        if: success() || failure()
        uses: github/codeql-action/upload-sarif@v4
        with:
          # Path to SARIF file relative to the root of the repository
          sarif_file: results/code-issues.sarif
          # Optional category for the results
          # Used to differentiate multiple results for one commit
          category: matlab

      - name: Upload Test Results
        if: success() || failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          if-no-files-found: error
          path: results/test-results*.xml

  publish-test-results:
    needs: check-and-test
    runs-on: ubuntu-latest
    permissions:
      checks: write
      # only needed unless run with comment_mode: off
      pull-requests: write
    if: (!cancelled())
    steps:
      - name: Download Test Results
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Publish Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: "artifacts/**/*.xml"
